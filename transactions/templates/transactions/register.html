{% extends "transactions/base.html" %}

{% block title %}Register | Card Management{% endblock %}

{% block content %}
<section class="panel narrow">
    <h1>Create Account</h1>
    <p class="muted">Register before saving card details.</p>

    <form method="post">
        {% csrf_token %}
        <div class="grid">
            <div class="field">
                <label for="first_name">First name</label>
                <input id="first_name" name="first_name" autocomplete="given-name" value="{{ form.first_name }}">
            </div>
            <div class="field">
                <label for="last_name">Last name</label>
                <input id="last_name" name="last_name" autocomplete="family-name" value="{{ form.last_name }}">
            </div>
        </div>
        <div class="field">
            <label for="username">Username</label>
            <input id="username" name="username" autocomplete="username" value="{{ form.username }}" required>
        </div>
        <div class="field">
            <label for="email">Email</label>
            <input id="email" name="email" type="email" autocomplete="email" value="{{ form.email }}">
        </div>
        <div class="field">
            <label for="password">Password</label>
            <input id="password" name="password" type="password" autocomplete="new-password" required>
        </div>
        <button class="button full" type="submit">Create Account</button>
    </form>
    <p class="muted">Already registered? <a href="{% url 'login-page' %}">Login</a>.</p>
</section>
{% endblock %}
