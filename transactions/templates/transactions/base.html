<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Payments Dashboard{% endblock %}</title>
    <style>
        :root {
            color-scheme: light;
            --bg: #f6f8fb;
            --surface: #ffffff;
            --line: #d8dee8;
            --text: #17202a;
            --muted: #5d6b7a;
            --primary: #1463ff;
            --primary-dark: #0b46bd;
            --danger: #c62828;
            --warning: #a35d00;
            --success: #17643a;
            --shadow: 0 16px 40px rgba(23, 32, 42, 0.08);
            --success-bg: #e8f5ee;
            --success-text: #17643a;
            --error-bg: #fdecec;
            --error-text: #9f1d1d;
            --warning-bg: #fff5df;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background: var(--bg);
            color: var(--text);
            font-family: Arial, Helvetica, sans-serif;
        }

        a {
            color: var(--primary);
            text-decoration: none;
        }

        .topbar {
            background: var(--surface);
            border-bottom: 1px solid var(--line);
            position: sticky;
            top: 0;
            z-index: 10;
        }

        .topbar-inner,
        .page {
            width: min(1180px, calc(100% - 32px));
            margin: 0 auto;
        }

        .topbar-inner {
            display: flex;
            min-height: 64px;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
        }

        .brand {
            font-size: 18px;
            font-weight: 700;
            color: var(--text);
        }

        .nav {
            display: flex;
            align-items: center;
            gap: 14px;
            color: var(--muted);
            font-size: 14px;
        }

        .page {
            padding: 32px 0;
        }

        .panel {
            background: var(--surface);
            border: 1px solid var(--line);
            border-radius: 8px;
            padding: 24px;
            box-shadow: var(--shadow);
        }

        .panel-title {
            margin: 0 0 6px;
            font-size: 19px;
            line-height: 1.25;
        }

        .narrow {
            max-width: 460px;
            margin: 32px auto;
        }

        .header-row {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            gap: 20px;
            margin-bottom: 20px;
        }

        .actions {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            align-items: center;
            justify-content: flex-end;
        }

        h1 {
            margin: 0 0 8px;
            font-size: 28px;
            line-height: 1.2;
        }

        .muted {
            color: var(--muted);
            margin: 0;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 16px;
        }

        .dashboard-grid {
            display: grid;
            grid-template-columns: minmax(320px, 0.85fr) minmax(0, 1.15fr);
            gap: 20px;
            align-items: start;
        }

        .stack {
            display: grid;
            gap: 20px;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(4, minmax(0, 1fr));
            gap: 14px;
            margin-bottom: 20px;
        }

        .admin-panel {
            margin-bottom: 20px;
        }

        .admin-links {
            display: grid;
            grid-template-columns: repeat(4, minmax(0, 1fr));
            gap: 12px;
            margin-top: 16px;
        }

        .admin-link {
            display: block;
            border: 1px solid var(--line);
            border-radius: 8px;
            padding: 14px;
            color: var(--text);
            background: #fbfcfe;
        }

        .admin-link strong {
            display: block;
            margin-bottom: 5px;
        }

        .stat {
            background: var(--surface);
            border: 1px solid var(--line);
            border-radius: 8px;
            padding: 18px;
            min-height: 102px;
            box-shadow: var(--shadow);
        }

        .stat-label {
            margin: 0 0 12px;
            color: var(--muted);
            font-size: 13px;
            font-weight: 700;
        }

        .stat-value {
            margin: 0;
            font-size: 25px;
            font-weight: 800;
            line-height: 1.15;
        }

        .field {
            display: flex;
            flex-direction: column;
            gap: 6px;
            margin-bottom: 14px;
        }

        label {
            font-size: 13px;
            font-weight: 700;
        }

        input,
        select {
            width: 100%;
            min-height: 42px;
            border: 1px solid var(--line);
            border-radius: 6px;
            padding: 10px 12px;
            color: var(--text);
            background: #fff;
            font: inherit;
        }

        .button {
            display: inline-flex;
            min-height: 42px;
            align-items: center;
            justify-content: center;
            border: 0;
            border-radius: 6px;
            padding: 10px 16px;
            background: var(--primary);
            color: #fff;
            cursor: pointer;
            font-weight: 700;
            font: inherit;
        }

        .button:hover {
            background: var(--primary-dark);
        }

        .button.secondary {
            background: #eef2f7;
            color: var(--text);
        }

        .button.secondary:hover {
            background: #dfe6ef;
        }

        .button.danger {
            background: var(--danger);
        }

        .button.danger:hover {
            background: #a91f1f;
        }

        .button.full {
            width: 100%;
        }

        .inline-form {
            margin: 0;
        }

        .messages {
            display: grid;
            gap: 8px;
            margin-bottom: 16px;
        }

        .message {
            border-radius: 6px;
            padding: 10px 12px;
            font-size: 14px;
        }

        .message.success {
            background: var(--success-bg);
            color: var(--success-text);
        }

        .message.error {
            background: var(--error-bg);
            color: var(--error-text);
        }

        .card-list {
            display: grid;
            gap: 12px;
            margin-top: 16px;
        }

        .card-item {
            display: grid;
            grid-template-columns: 1fr auto;
            gap: 16px;
            align-items: center;
            border: 1px solid var(--line);
            border-radius: 8px;
            padding: 16px;
        }

        .card-number {
            margin: 0 0 6px;
            font-size: 18px;
            font-weight: 700;
        }

        .meta {
            color: var(--muted);
            font-size: 14px;
        }

        .table-wrap {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            min-width: 640px;
        }

        th,
        td {
            border-bottom: 1px solid var(--line);
            padding: 12px 10px;
            text-align: left;
            vertical-align: middle;
            font-size: 14px;
        }

        th {
            color: var(--muted);
            font-size: 12px;
            text-transform: uppercase;
        }

        .status {
            display: inline-flex;
            align-items: center;
            border-radius: 999px;
            padding: 5px 9px;
            font-size: 12px;
            font-weight: 800;
        }

        .status.success {
            background: var(--success-bg);
            color: var(--success);
        }

        .status.failed {
            background: var(--error-bg);
            color: var(--error-text);
        }

        .status.pending {
            background: var(--warning-bg);
            color: var(--warning);
        }

        .empty {
            border: 1px dashed var(--line);
            border-radius: 8px;
            padding: 24px;
            color: var(--muted);
            text-align: center;
        }

        @media (max-width: 700px) {
            .topbar-inner,
            .header-row,
            .card-item {
                align-items: stretch;
                flex-direction: column;
            }

            .actions {
                justify-content: stretch;
            }

            .actions .button {
                width: 100%;
            }

            .topbar-inner,
            .nav {
                flex-direction: column;
                justify-content: center;
                padding: 12px 0;
            }

            .stats,
            .admin-links,
            .dashboard-grid,
            .grid,
            .card-item {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <header class="topbar">
        <div class="topbar-inner">
            <a class="brand" href="{% url 'home-page' %}">Payments Dashboard</a>
            <nav class="nav">
                {% if request.user.is_authenticated %}
                    <span>{{ request.user.username }}</span>
                    <a href="{% url 'card-list-page' %}">Dashboard</a>
                    <form class="inline-form" method="post" action="{% url 'logout-page' %}">
                        {% csrf_token %}
                        <button class="button secondary" type="submit">Logout</button>
                    </form>
                {% else %}
                    <a href="{% url 'login-page' %}">Login</a>
                    <a href="{% url 'register-page' %}">Register</a>
                {% endif %}
            </nav>
        </div>
    </header>

    <main class="page">
        {% if messages %}
            <div class="messages">
                {% for message in messages %}
                    <div class="message {{ message.tags }}">{{ message }}</div>
                {% endfor %}
            </div>
        {% endif %}
        {% block content %}{% endblock %}
    </main>
</body>
</html>
