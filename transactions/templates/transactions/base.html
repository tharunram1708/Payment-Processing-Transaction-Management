<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Card Management{% endblock %}</title>
    <style>
        :root {
            color-scheme: light;
            --bg: #f6f8fb;
            --surface: #ffffff;
            --line: #d8dee8;
            --text: #17202a;
            --muted: #5d6b7a;
            --primary: #1463ff;
            --danger: #c62828;
            --success-bg: #e8f5ee;
            --success-text: #17643a;
            --error-bg: #fdecec;
            --error-text: #9f1d1d;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background: var(--bg);
            color: var(--text);
            font-family: Arial, Helvetica, sans-serif;
        }

        a {
            color: var(--primary);
            text-decoration: none;
        }

        .topbar {
            background: var(--surface);
            border-bottom: 1px solid var(--line);
        }

        .topbar-inner,
        .page {
            width: min(1040px, calc(100% - 32px));
            margin: 0 auto;
        }

        .topbar-inner {
            display: flex;
            min-height: 64px;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
        }

        .brand {
            font-size: 18px;
            font-weight: 700;
        }

        .nav {
            display: flex;
            align-items: center;
            gap: 14px;
            color: var(--muted);
            font-size: 14px;
        }

        .page {
            padding: 32px 0;
        }

        .panel {
            background: var(--surface);
            border: 1px solid var(--line);
            border-radius: 8px;
            padding: 24px;
        }

        .narrow {
            max-width: 460px;
            margin: 32px auto;
        }

        .header-row {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            gap: 20px;
            margin-bottom: 20px;
        }

        h1 {
            margin: 0 0 8px;
            font-size: 28px;
            line-height: 1.2;
        }

        .muted {
            color: var(--muted);
            margin: 0;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 16px;
        }

        .field {
            display: flex;
            flex-direction: column;
            gap: 6px;
            margin-bottom: 14px;
        }

        label {
            font-size: 13px;
            font-weight: 700;
        }

        input,
        select {
            width: 100%;
            min-height: 42px;
            border: 1px solid var(--line);
            border-radius: 6px;
            padding: 10px 12px;
            color: var(--text);
            background: #fff;
            font: inherit;
        }

        .button {
            display: inline-flex;
            min-height: 42px;
            align-items: center;
            justify-content: center;
            border: 0;
            border-radius: 6px;
            padding: 10px 16px;
            background: var(--primary);
            color: #fff;
            cursor: pointer;
            font-weight: 700;
            font: inherit;
        }

        .button.secondary {
            background: #eef2f7;
            color: var(--text);
        }

        .button.danger {
            background: var(--danger);
        }

        .button.full {
            width: 100%;
        }

        .inline-form {
            margin: 0;
        }

        .messages {
            display: grid;
            gap: 8px;
            margin-bottom: 16px;
        }

        .message {
            border-radius: 6px;
            padding: 10px 12px;
            font-size: 14px;
        }

        .message.success {
            background: var(--success-bg);
            color: var(--success-text);
        }

        .message.error {
            background: var(--error-bg);
            color: var(--error-text);
        }

        .card-list {
            display: grid;
            gap: 12px;
            margin-top: 16px;
        }

        .card-item {
            display: grid;
            grid-template-columns: 1fr auto;
            gap: 16px;
            align-items: center;
            border: 1px solid var(--line);
            border-radius: 8px;
            padding: 16px;
        }

        .card-number {
            margin: 0 0 6px;
            font-size: 18px;
            font-weight: 700;
        }

        .meta {
            color: var(--muted);
            font-size: 14px;
        }

        .empty {
            border: 1px dashed var(--line);
            border-radius: 8px;
            padding: 24px;
            color: var(--muted);
            text-align: center;
        }

        @media (max-width: 700px) {
            .topbar-inner,
            .header-row,
            .card-item {
                align-items: stretch;
                flex-direction: column;
            }

            .topbar-inner,
            .nav {
                flex-direction: column;
                justify-content: center;
                padding: 12px 0;
            }

            .grid,
            .card-item {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <header class="topbar">
        <div class="topbar-inner">
            <a class="brand" href="{% url 'home-page' %}">Card Management</a>
            <nav class="nav">
                {% if request.user.is_authenticated %}
                    <span>{{ request.user.username }}</span>
                    <a href="{% url 'card-list-page' %}">Cards</a>
                    <form class="inline-form" method="post" action="{% url 'logout-page' %}">
                        {% csrf_token %}
                        <button class="button secondary" type="submit">Logout</button>
                    </form>
                {% else %}
                    <a href="{% url 'login-page' %}">Login</a>
                    <a href="{% url 'register-page' %}">Register</a>
                {% endif %}
            </nav>
        </div>
    </header>

    <main class="page">
        {% if messages %}
            <div class="messages">
                {% for message in messages %}
                    <div class="message {{ message.tags }}">{{ message }}</div>
                {% endfor %}
            </div>
        {% endif %}
        {% block content %}{% endblock %}
    </main>
</body>
</html>
